[build]
  publish = "."
  # Stamp nav/footer from partials/ and regenerate sitemap.xml so a deploy
  # cannot ship stale shared markup even if those scripts were not run locally.
  command = "python3 tools/sync-shared.py && python3 tools/build-sitemap.py"

# ---------------------------------------------------------------- canonical host
[[redirects]]
  from = "https://www.getbespoke.ai/*"
  to = "https://getbespoke.ai/:splat"
  status = 301
  force = true

# ------------------------------------------------- renamed solution hubs (SEO)
# Batch 3 moved each category to a keyword slug; every old hub, child page,
# and .html form 301s straight to its new home. The older renames
# (/law, /professional-services) point at the final URLs too, so nothing
# goes through a redirect chain. Children are swept up by the splat rules.
[[redirects]]
  from = "/finance"
  to = "/custom-financial-software"
  status = 301
  force = true

[[redirects]]
  from = "/finance.html"
  to = "/custom-financial-software"
  status = 301
  force = true

[[redirects]]
  from = "/finance/*"
  to = "/custom-financial-software/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/legal"
  to = "/custom-legal-software"
  status = 301
  force = true

[[redirects]]
  from = "/legal.html"
  to = "/custom-legal-software"
  status = 301
  force = true

[[redirects]]
  from = "/legal/*"
  to = "/custom-legal-software/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/edtech"
  to = "/custom-edtech-software"
  status = 301
  force = true

[[redirects]]
  from = "/edtech.html"
  to = "/custom-edtech-software"
  status = 301
  force = true

[[redirects]]
  from = "/edtech/*"
  to = "/custom-edtech-software/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/general-services"
  to = "/custom-general-service-software"
  status = 301
  force = true

[[redirects]]
  from = "/general-services.html"
  to = "/custom-general-service-software"
  status = 301
  force = true

# Before batch 3 the real estate page lived here; skip the splat below so it
# reaches its batch 4 home in one hop instead of two.
[[redirects]]
  from = "/general-services/real-estate"
  to = "/custom-real-estate-software/residential-real-estate"
  status = 301
  force = true

[[redirects]]
  from = "/general-services/real-estate.html"
  to = "/custom-real-estate-software/residential-real-estate"
  status = 301
  force = true

[[redirects]]
  from = "/general-services/*"
  to = "/custom-general-service-software/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/law"
  to = "/custom-legal-software"
  status = 301
  force = true

[[redirects]]
  from = "/law.html"
  to = "/custom-legal-software"
  status = 301
  force = true

[[redirects]]
  from = "/law/*"
  to = "/custom-legal-software/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/professional-services"
  to = "/custom-general-service-software"
  status = 301
  force = true

[[redirects]]
  from = "/professional-services.html"
  to = "/custom-general-service-software"
  status = 301
  force = true

[[redirects]]
  from = "/professional-services/*"
  to = "/custom-general-service-software/:splat"
  status = 301
  force = true

# ----------------------------------------- real estate moved to its own hub (SEO)
# Batch 4 promoted Real Estate from a General Services page to a category.
# The original page lives on as Residential Real Estate; send its old URL and
# .html form straight there so its ranking history carries over.
[[redirects]]
  from = "/custom-general-service-software/real-estate"
  to = "/custom-real-estate-software/residential-real-estate"
  status = 301
  force = true

[[redirects]]
  from = "/custom-general-service-software/real-estate.html"
  to = "/custom-real-estate-software/residential-real-estate"
  status = 301
  force = true

# ------------------------------------------------ .html -> extensionless URLs
# Kept so old inbound links and indexed .html URLs land on the canonical form.
# Internal links across the site are already written extensionless, so these
# should only ever fire for external traffic.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/about"
  to = "/custom-software-development-team"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/custom-software-development-team"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/demos.html"
  to = "/demos"
  status = 301
  force = true

[[redirects]]
  from = "/insights"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/insights.html"
  to = "/"
  status = 301
  force = true

# The original articles were retired; send old links home until the
# Industry Analysis section is rebuilt.
[[redirects]]
  from = "/articles/*"
  to = "/"
  status = 301
  force = true

# --------------------------------------------------------------- catch-all 404
# Must stay last: Netlify applies the first matching rule.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
