[build]
  publish = "."
  command = ""

[[redirects]]
  from = "https://www.getbespoke.ai/*"
  to = "https://getbespoke.ai/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/demos.html"
  to = "/demos"
  status = 301
  force = true

[[redirects]]
  from = "/finance.html"
  to = "/finance"
  status = 301
  force = true

[[redirects]]
  from = "/law.html"
  to = "/law"
  status = 301
  force = true

[[redirects]]
  from = "/professional-services.html"
  to = "/professional-services"
  status = 301
  force = true

[[redirects]]
  from = "/insights.html"
  to = "/insights"
  status = 301
  force = true

[[redirects]]
  from = "/articles/:slug.html"
  to = "/articles/:slug"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
